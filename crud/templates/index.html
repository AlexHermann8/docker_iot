{% extends "layout.html" %}
{% block body %}
<div class="row">
  <div class="col-md-7 mx-auto">
    <div class="card card-body">
      <form action="{{url_for('enviar_mqtt')}}" method="POST">
        <legend>Control Termostato (MQTT)</legend>
        
        <div class="form-group">
          <label class="col-form-label mt-4" for="macNode">Nodo Destino (MAC)</label>
          <select class="form-control" id="macNode" name="mac_node">
            <option value="1324">Nodo Prueba (ID: 1324)</option>
            <option value="a1b2c3d4e5f6">Pico de Laboratorio</option>
          </select>
          <div class="input-group mt-2">
            <input type="text" id="newMac" class="form-control" placeholder="Agregar MAC manualmente">
            <button class="btn btn-secondary" type="button" onclick="agregarMac()">Anadir MAC</button>
          </div>
        </div>

        <div class="form-group">
          <label class="col-form-label mt-4" for="setpointVal">Valor del Setpoint</label>
          <input type="number" step="0.1" class="form-control" id="setpointVal" name="setpoint_val" placeholder="Ej: 24.5">
        </div>

        <div class="row mt-4">
          <div class="col-md-6">
            <button type="submit" name="accion" value="setpoint" class="btn btn-primary w-100">Enviar Setpoint</button>
          </div>
          <div class="col-md-6 mt-3 mt-md-0">
            <button type="submit" name="accion" value="destello" class="btn btn-warning w-100">Enviar Destello</button>
          </div>
        </div>

      </form>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const select = document.getElementById('macNode');
    const savedMacs = JSON.parse(sessionStorage.getItem('customMacs')) || [];
    
    savedMacs.forEach(mac => {
        const option = document.createElement('option');
        option.value = mac;
        option.text = mac + " (Agregada)";
        select.appendChild(option);
    });

    const lastSelected = sessionStorage.getItem('lastSelectedMac');
    if (lastSelected) {
        select.value = lastSelected;
    }

    select.addEventListener('change', (e) => {
        sessionStorage.setItem('lastSelectedMac', e.target.value);
    });
});

function agregarMac() {
    const input = document.getElementById('newMac');
    const select = document.getElementById('macNode');
    const nuevaMac = input.value.trim();

    if(nuevaMac !== "") {
        const option = document.createElement('option');
        option.value = nuevaMac;
        option.text = nuevaMac + " (Agregada)";
        option.selected = true;
        select.appendChild(option);
        input.value = ""; 

        const savedMacs = JSON.parse(sessionStorage.getItem('customMacs')) || [];
        if (!savedMacs.includes(nuevaMac)) {
            savedMacs.push(nuevaMac);
            sessionStorage.setItem('customMacs', JSON.stringify(savedMacs));
        }
        sessionStorage.setItem('lastSelectedMac', nuevaMac);
    }
}
</script>
{% endblock %}
